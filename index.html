<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0f766e" />
  <meta name="description" content="Luyện tập Kanji bằng file Excel, CSV hoặc Google Sheets." />
  <title>漢字練習</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png" />
  <link rel="shortcut icon" type="image/png" href="assets/icons/icon-192.png" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700&family=Noto+Sans+JP:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/css/styles.css" />
</head>
<body>
  <main class="container">
    <header class="hero">
      <div>
        <p class="eyebrow">Kanji Renshuu</p>
        <h1>漢字練習</h1>
        <p>Luyện Kanji bằng Excel, CSV hoặc Google Sheets. Chọn phạm vi bài, vào quiz, và ôn đúng phần mình cần nhớ.</p>
      </div>
      <div class="hero-mark" aria-hidden="true">練</div>
    </header>

    <section class="card setup-card">
      <div class="section-heading">
        <div>
          <p class="eyebrow">Thiết lập</p>
          <h2>Nguồn dữ liệu và chế độ luyện</h2>
        </div>
        <button id="themeToggleBtn" class="theme-switch" type="button" aria-pressed="false" title="Bật dark mode">
          <span class="theme-switch-knob" aria-hidden="true"></span>
        </button>
      </div>

      <div class="grid grid-2">
        <div>
          <label for="fileInput">File dữ liệu Kanji</label>
          <input id="fileInput" type="file" accept=".xlsx,.xls,.csv" />
        </div>
        <div>
          <label for="modeSelect">Chế độ luyện tập</label>
          <select id="modeSelect" class="native-select" tabindex="-1" aria-hidden="true">
            <option value="reading-to-kanji">Nhìn Âm Hán -> Chọn Kanji</option>
            <option value="kanji-to-reading">Nhìn Kanji -> Chọn Âm Hán</option>
          </select>
          <div class="custom-select" data-for="modeSelect">
            <button id="modeSelectButton" class="custom-select-button" type="button" aria-haspopup="listbox" aria-expanded="false">
              <span id="modeSelectText">Nhìn Âm Hán -> Chọn Kanji</span>
              <span class="custom-select-arrow" aria-hidden="true">⌄</span>
            </button>
            <div id="modeSelectMenu" class="custom-select-menu hidden" role="listbox" aria-labelledby="modeSelectButton">
              <button class="custom-select-option selected" type="button" role="option" aria-selected="true" data-value="reading-to-kanji">Nhìn Âm Hán -> Chọn Kanji</button>
              <button class="custom-select-option" type="button" role="option" aria-selected="false" data-value="kanji-to-reading">Nhìn Kanji -> Chọn Âm Hán</button>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-3 form-row">
        <div>
          <label for="questionCount">Số câu</label>
          <div class="input-action">
            <input id="questionCount" type="number" value="10" min="1" max="300" />
            <button id="maxQuestionBtn" class="mini" type="button">Max</button>
          </div>
        </div>
        <div>
          <label for="lessonFrom">Từ bài</label>
          <input id="lessonFrom" type="number" min="1" placeholder="Không bắt buộc" />
        </div>
        <div>
          <label for="lessonTo">Đến bài</label>
          <input id="lessonTo" type="number" min="1" placeholder="Không bắt buộc" />
        </div>
      </div>

      <div class="grid url-grid form-row">
        <div>
          <label for="urlInput">URL file Excel / CSV / Google Sheets</label>
          <input id="urlInput" type="text" value="https://docs.google.com/spreadsheets/d/1Lsvnce88zkeASGQPzPJXcjfg2yBjx1b2yMlloLmDy7I/edit?gid=0#gid=0" />
        </div>
        <div class="align-bottom">
          <button id="importBtn" class="secondary" type="button">Import từ URL</button>
        </div>
      </div>

      <div class="actions">
        <button id="startBtn" type="button">Bắt đầu luyện tập</button>
      </div>

      <div id="fileInfo" class="status">Đang tải dữ liệu từ Google Sheets...</div>
      <div id="errorMessage" class="alert hidden"></div>
    </section>

    <section id="quizArea" class="card quiz-card hidden">
      <div class="quiz-topline">
        <div class="status" id="quizStatus"></div>
        <div class="footer" id="scoreInfo"></div>
      </div>

      <div class="question-box">
        <h2 id="questionPrompt">Câu hỏi sẽ xuất hiện ở đây</h2>
        <div class="options" id="options"></div>
      </div>

      <div class="button-row">
        <button id="confirmBtn" class="secondary hidden" type="button">Xác nhận</button>
        <button id="nextBtn" class="secondary hidden" type="button">Câu tiếp theo</button>
        <button id="resetBtn" class="ghost" type="button">Làm lại</button>
      </div>
    </section>
  </main>

  <script src="libs/xlsx.full.min.js"></script>
  <script src="assets/js/app.js" defer></script>
</body>
</html>
